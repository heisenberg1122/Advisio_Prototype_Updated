<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Starting your evaluation · ADVISIO</title>
    <link rel="icon" type="image/png" href="/advisio-logo.png" />
    <link rel="stylesheet" href="/evaluation-launcher.css" />
    <script src="/evaluation-launcher.js" defer></script>
  </head>
  <body>
    <main>
      <img src="/advisio-logo.png" alt="ADVISIO" width="120" height="96" />
      <div role="status" aria-live="polite" aria-atomic="true">
        <h1 id="startup-title">Starting your evaluation environment…</h1>
        <p id="startup-message">This may take about a minute. Keep this page open—we’ll continue automatically.</p>
      </div>
      <div class="loading-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <button id="startup-retry" type="button" hidden>Try again</button>
      <noscript>
        <p>Enable JavaScript to continue automatically, or <a href="https://advisio-tam-evaluation-2026.onrender.com/evaluate">open the evaluation directly</a>.</p>
      </noscript>
    </main>
    <footer>
      <p>ADVISIO · Evaluation environment</p>
      <a href="mailto:advisio.main@gmail.com?subject=ADVISIO%20Evaluation%20Support">Need help?</a>
    </footer>
  </body>
</html>
