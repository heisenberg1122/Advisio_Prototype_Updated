<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (() => {
      try {
        const authenticated = Boolean(localStorage.getItem("advisio_token"));
        const appearance = authenticated
          ? localStorage.getItem("advisio_theme:active") || "system"
          : "light";
        const dark =
          appearance === "dark" ||
          (appearance === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.appearance = appearance;
        document.documentElement.dataset.collegeTheme = authenticated
          ? localStorage.getItem("advisio_college-theme:active") || "default"
          : "default";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {
        document.documentElement.dataset.collegeTheme = "default";
      }
    })();
  </script>
  <title>Advisio — Research, Advising & Management Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
</head>

<body class="bg-[var(--sidebar-background)] text-[var(--color-text-primary)] antialiased font-sans">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
