version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: advisio-postgres
    restart: always
    environment:
      POSTGRES_USER: advisio
      POSTGRES_PASSWORD: advisiopassword
      POSTGRES_DB: advisio_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisio -d advisio_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
