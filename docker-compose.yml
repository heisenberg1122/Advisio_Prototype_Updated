services:
  postgres:
    image: postgres:16-alpine
    container_name: advisio-postgres
    restart: always
    environment:
      POSTGRES_USER: advisio_local
      POSTGRES_PASSWORD: advisio_local_password
      POSTGRES_DB: advisio_local
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisio_local -d advisio_local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
