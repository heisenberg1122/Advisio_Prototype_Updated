name: Advisio CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    env:
      DATABASE_URL: "postgresql://postgres:admin@localhost:5432/advisio_dev?schema=public"
      JWT_SECRET: "ci-secret-jwt-key-for-test-validation"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run build --workspace=@research-management/database

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npm run type-check

      - name: Run Unit Tests
        run: npm run test

      - name: Build All Monorepo Packages
        run: npm run build
