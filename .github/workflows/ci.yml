name: Advisio CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Unit Tests, Lint, Typecheck & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    env:
      DATABASE_URL: "postgresql://postgres:admin@localhost:5432/advisio_dev?schema=public"
      JWT_SECRET: "ci-secret-jwt-key-for-test-validation"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Internal Packages
        run: |
          npm run build --workspace=@research-management/database
          npm run build --workspace=@research-management/auth
          npm run build --workspace=@research-management/validations
          npm run build --workspace=@research-management/email

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npm run type-check

      - name: Run Unit Tests
        run: npm run test

      - name: Build All Monorepo Packages
        run: npm run build

  database-integration:
    name: Sequential Database Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: advisio_test
          POSTGRES_PASSWORD: advisio_test_password
          POSTGRES_DB: advisio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U advisio_test -d advisio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: "test"
      RUN_DATABASE_INTEGRATION_TESTS: "1"
      INTEGRATION_DATABASE_EXPECTED_NAME: "advisio_test"
      DATABASE_URL: "postgresql://advisio_test:advisio_test_password@127.0.0.1:5432/advisio_test?schema=public&application_name=advisio-integration-tests"
      DIRECT_URL: "postgresql://advisio_test:advisio_test_password@127.0.0.1:5432/advisio_test?schema=public&application_name=advisio-integration-tests"
      INTEGRATION_DATABASE_URL: "postgresql://advisio_test:advisio_test_password@127.0.0.1:5432/advisio_test?schema=public&application_name=advisio-integration-tests"
      JWT_SECRET: "ci-secret-jwt-key-for-test-validation"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Required Internal Packages
        run: |
          npm run build --workspace=@research-management/database
          npm run build --workspace=@research-management/auth
          npm run build --workspace=@research-management/validations
          npm run build --workspace=@research-management/email

      - name: Run Database Integration Suites Sequentially
        run: npm run test:integration
