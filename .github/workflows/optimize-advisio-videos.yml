name: Optimize Advisio downloadable videos

on:
  push:
    branches:
      - codex/optimize-advisio-video-assets
  pull_request:
    branches:
      - main
    paths:
      - scripts/optimize-deployment-media.mjs
      - .github/workflows/optimize-advisio-videos.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-advisio-media
  cancel-in-progress: false

jobs:
  recompress:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || (github.head_ref == 'codex/optimize-advisio-video-assets' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/optimize-advisio-video-assets
          persist-credentials: true
      - name: Verify video tools
        run: |
          command -v ffmpeg
          command -v ffprobe
      - name: Recompress downloadable MP4s and refresh checksums
        run: node scripts/optimize-deployment-media.mjs
      - name: Commit optimized media on optimization branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/walkthroughs
          if ! git diff --cached --quiet; then
            git commit -m "chore: compress downloadable walkthrough assets [skip ci]"
            git push origin HEAD:codex/optimize-advisio-video-assets
          else
            echo "No assets qualified for replacement"
          fi
