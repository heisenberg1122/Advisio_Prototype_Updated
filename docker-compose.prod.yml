services:
  postgres:
    image: postgres:16-alpine
    container_name: advisio-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - advisio-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: advisio-prod-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET of at least 32 characters}
      AUTH_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET of at least 32 characters}
      CORS_ORIGIN: ${WEB_URL:-http://localhost}
      WEB_URL: ${WEB_URL:-http://localhost}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-GOOGLE_DRIVE}
      ALLOW_LOCAL_STORAGE_FALLBACK: "false"
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-manuscripts}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_PRIVATE_KEY: ${GOOGLE_PRIVATE_KEY:-}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      GOOGLE_SIGN_IN_CLIENT_ID: ${GOOGLE_SIGN_IN_CLIENT_ID:-}
      GOOGLE_SIGN_IN_ALLOW_SELF_SIGNUP: "false"
      ALLOW_DEMO_ACCOUNT_PROVISIONING: "false"
      ALLOW_THEME_DEMO_ACCOUNTS: "false"
    ports:
      - "5000:5000"
    networks:
      - advisio-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: advisio-prod-web
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
    networks:
      - advisio-network

volumes:
  postgres_prod_data:

networks:
  advisio-network:
    driver: bridge
